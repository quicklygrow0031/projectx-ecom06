<!-- Single Custom Tag to place anywhere in your project -->
<luxury-bottom-bar></luxury-bottom-bar>

<script>
  class LuxuryBottomBar extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });

      this.shadowRoot.innerHTML = `
        <!-- Google Fonts for High-End Minimalist Label -->
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

        <style>
          :host {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            pointer-events: none; /* Empty spaces let clicks pass through to site */
          }

          /* Floating Boxes Wrapper with Gap */
          .boxes-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px; /* 👈 ( Box )  ( Box )  ( Box ) Distinct Floating Gaps */
          }

          /* Individual Floating Box */
          .nav-box {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            
            /* Box Sizing & Shape */
            width: 58px;
            height: 58px;
            border-radius: 18px;
            
            /* Glassmorphic Luxury Box */
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* Sleek Subtle Border */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #71717a;
            
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45),
                        inset 0 1px 1px rgba(255, 255, 255, 0.12);
                        
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
          }

          /* OFF-SVG Styling (Clean Minimal Outline) */
          .nav-box svg {
            width: 20px;
            height: 20px;
            stroke: #a1a1aa; /* Crisp off-state silver-grey stroke */
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
            margin-bottom: 3px;
            opacity: 0.85;
          }

          /* Label Text */
          .nav-box span {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 8.5px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #a1a1aa;
            transition: all 0.3s ease;
          }

          /* DRAFT ACTIVE / HOME ACTIVE STATE (Golden Glass Accent) */
          .nav-box.draft-active {
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.22), rgba(24, 24, 28, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5),
                        0 0 18px rgba(212, 175, 55, 0.2);
            transform: translateY(-3px);
          }

          .nav-box.draft-active svg {
            stroke: #d4af37; /* Warm Gold for Active Home */
            opacity: 1;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
          }

          .nav-box.draft-active span {
            color: #ffffff;
            font-weight: 700;
          }

          /* Smooth Box Hover Effect */
          .nav-box:hover:not(.draft-active) {
            background: rgba(32, 32, 38, 0.85);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
          }

          .nav-box:hover:not(.draft-active) svg {
            stroke: #ffffff;
            opacity: 1;
          }
        </style>

        <div class="boxes-container">
          <!-- 1. Home (Draft Active) -->
          <a href="#" class="nav-box draft-active">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
          </a>

          <!-- 2. Catalog (OFF SVG) -->
          <a href="#" class="nav-box">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Catalog</span>
          </a>

          <!-- 3. Saved (OFF SVG) -->
          <a href="#" class="nav-box">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <span>Saved</span>
          </a>

          <!-- 4. Bag (OFF SVG) -->
          <a href="#" class="nav-box">
            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span>Bag</span>
          </a>

          <!-- 5. Account (OFF SVG) -->
          <a href="#" class="nav-box">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Account</span>
          </a>
        </div>
      `;

      // Click Par Active Draft Shift karne ka Logic
      const boxes = this.shadowRoot.querySelectorAll('.nav-box');
      boxes.forEach(box => {
        box.addEventListener('click', (e) => {
          e.preventDefault();
          boxes.forEach(b => b.classList.remove('draft-active'));
          box.classList.add('draft-active');
        });
      });
    }
  }

  customElements.define('luxury-bottom-bar', LuxuryBottomBar);
</script>
